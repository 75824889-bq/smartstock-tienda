<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Stock Tienda</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smart Stock">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#1d2433;--mute:#667085;--navy:#1F3864;--line:#E3E7ED;--soft:#F2F4F7;--g:#2E9E5B;--a:#E8A317;--r:#D64545;--rb:#FADBD8;--gb:#D5F5E3;--ab:#FFF4D6;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#1a212c;--ink:#e8ecf3;--mute:#9aa6b8;--navy:#4A74C9;--line:#2a3342;--soft:#232c3a;--rb:#4a2323;--gb:#1d3a2a;--ab:#3a3217}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#1a212c;--ink:#e8ecf3;--mute:#9aa6b8;--navy:#4A74C9;--line:#2a3342;--soft:#232c3a;--rb:#4a2323;--gb:#1d3a2a;--ab:#3a3217}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px}
.wrap{max-width:460px;margin:0 auto;padding:0 12px 96px}
.top{background:var(--navy);color:#fff;margin:0 -12px 12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{margin:0;font-size:17px}.top small{font-size:11px;opacity:.85;display:block}.mode{font-size:11px;background:rgba(255,255,255,.18);border-radius:10px;padding:3px 8px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:15px;margin:0 0 8px;color:var(--navy)}h3{font-size:13px;margin:10px 0 6px;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;text-align:center}.kpi b{display:block;font-size:19px}.kpi span{font-size:10px;color:var(--mute)}
.c-g{color:var(--g)}.c-a{color:var(--a)}.c-r{color:var(--r)}.c-n{color:var(--mute)}.b{font-weight:bold}
.msg{border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}.m-r{background:var(--rb)}.m-g{background:var(--gb)}.m-a{background:var(--ab)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:14px}.item small,.sm{color:var(--mute);font-size:12px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:bold;margin-top:8px;font-family:inherit}.btn.o{background:var(--card);color:var(--navy);border:1px solid var(--navy)}.btn.s{padding:8px 12px;font-size:13px;width:auto;display:inline-block;margin:6px 6px 0 0}.btn.d{background:var(--r);color:#fff;border:0}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;margin:3px 0 7px}
input[type=number]{text-align:right}label{font-size:12px;color:var(--mute);display:block}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.acc{width:100%;text-align:left;background:var(--soft);border:0;border-radius:10px;padding:10px 12px;margin-bottom:7px;font-size:14px;color:var(--ink);font-family:inherit}.acc small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.det{background:var(--soft);border-radius:10px;padding:8px 11px;margin:-4px 0 8px;font-size:13px}.det table{width:100%;border-collapse:collapse}.det td{padding:5px 0;border-bottom:1px solid var(--line)}.det td:not(:first-child){text-align:right}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--navy);background:var(--card);color:var(--navy);font-size:13px;font-weight:bold}.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chips button{white-space:nowrap;border:1px solid var(--navy);background:var(--card);color:var(--navy);border-radius:16px;padding:6px 12px;font-size:12px;font-family:inherit}.chips button.on{background:var(--navy);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.tabs div{max-width:460px;margin:0 auto;display:flex}.tabs button{flex:1;border:0;background:transparent;color:var(--mute);font-size:11px;padding:8px 0;font-weight:bold;font-family:inherit}.tabs button.on{color:var(--navy);border-top:3px solid var(--navy)}
#upd{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:436px;margin:0 auto;background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;font-size:13px;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}#upd.on{display:flex}#upd button{border:0;border-radius:8px;background:#fff;color:var(--navy);font-weight:bold;padding:8px 12px;font-size:13px;font-family:inherit}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" width="38" height="38" style="border-radius:9px"><div><h1>Smart Stock</h1><small>Tienda · Control de inventarios · v<span id="ver"></span></small></div></div><span class="mode">Solo en este celular</span></div><div id="app"></div></div>
<nav class="tabs"><div id="tabs"></div></nav><div id="upd"><span>Hay una versión nueva de Smart Stock Tienda.</span><button onclick="location.reload()">Actualizar</button></div><div id="toast"></div>
<script>
var VER="1.0",NOV=[["1.0","Primera versión de Smart Stock Tienda: catálogo de productos con importación desde archivo CSV, salidas por producto, stock con semáforo, compra sugerida, facturas de compra, conteo físico parcial, respaldo y aviso de versión nueva."]];
var DEF={t0:0,igv:.18,pvs:[],prods:[]};
var COLS=["salidas","facturas","conteos"];
var UN=["und","caja","paq","docena","par","rollo","bolsa","kg","g","m","L","gal"];
var TITULAR="";
var ST={cfg:null,salidas:[],facturas:[],conteos:[],S:{},pm:{},tab:"ini",sub:"sug",q:"",cat:"",fil:"",lim:30,op:null,of:null,conf:null,nov:false,cart:[],tipo:"Venta",fd:null,cm:false,cnt:{},add:false,imp:null,mas:null};
function cl(o){return JSON.parse(JSON.stringify(o))}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return(+(+n).toFixed(2)).toString().replace(".",",")}
function m(n){return"S/ "+(+n).toFixed(2)}
function iso(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fd(s){var p=String(s).split("-");return p.length==3?p[2]+"/"+p[1]+"/"+p[0]:s}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function num(s){if(s==null)return null;var t=String(s).replace(/[^0-9,.\-]/g,"");if(t===""||t==="-")return null;if(/,\d{1,2}$/.test(t)&&t.indexOf(".")<0)t=t.replace(",",".");t=t.replace(/,/g,"");var n=parseFloat(t);return isNaN(n)?null:n}
function opts(a,v){return a.map(function(x){return'<option'+(x==v?' selected':'')+'>'+esc(x)+'</option>'}).join("")}
function toast(t){var e=$("toast");e.textContent=t;e.className="on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2600)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("sst_"+k));localStorage.setItem("sst_"+k,JSON.stringify(v))}catch(e){if(v!==undefined)toast("No se pudo guardar en este celular");return null}}
/* ---------- datos ---------- */
function loadLocal(){ST.cfg=ls("cfg")||cl(DEF);["igv","pvs","t0","prods"].forEach(function(k){if(ST.cfg[k]==null)ST.cfg[k]=cl(DEF[k])});COLS.forEach(function(c){ST[c]=ls(c)||[]});idx()}
function idx(){ST.pm={};ST.cfg.prods.forEach(function(p){ST.pm[p.id]=p})}
function saveCfg(){ls("cfg",ST.cfg);idx()}
function put(c,o){var a=ST[c],k=-1;a.forEach(function(x,i){if(x.id==o.id)k=i});if(k<0)a.push(o);else a[k]=o;a.sort(function(x,y){return x.ts-y.ts});ls(c,a)}
function del(c,id){ST[c]=ST[c].filter(function(x){return x.id!=id});ls(c,ST[c])}
function arm(c,id){var k=c+id;if(ST.conf!=k){ST.conf=k;render();return}ST.conf=null;del(c,id);render();toast("Anulado")}
function P(id){return ST.pm[id]||{id:id,n:"(producto eliminado)",u:"",cod:"",min:0,max:0,pr:0,pv:0}}
/* ---------- cálculo ---------- */
function stockAll(){var base={},s={};ST.cfg.prods.forEach(function(p){base[p.id]=ST.cfg.t0||0;s[p.id]=+p.s0||0});
 ST.conteos.forEach(function(c){for(var id in c.q){if(base[id]!=null&&c.ts>=base[id]){base[id]=c.ts;s[id]=+c.q[id]}}});
 ST.facturas.forEach(function(x){x.it.forEach(function(l){if(base[l[0]]!=null&&x.ts>base[l[0]])s[l[0]]+=+l[1]})});
 ST.salidas.forEach(function(x){x.it.forEach(function(l){if(base[l[0]]!=null&&x.ts>base[l[0]])s[l[0]]-=+l[1]})});
 for(var k in s)s[k]=Math.round(Math.max(0,s[k])*1000)/1000;return s}
function est(p,s){var a=+p.min||0;if(a<=0)return"n";return s<a?"r":(s<=a*1.5?"a":"g")}
function obj(p){var mx=+p.max||0,a=+p.min||0;return mx>0?mx:a*2}
function lab(x){return x=="r"?"Comprar":x=="a"?"Revisar":x=="g"?"Adecuado":"Sin mínimo"}
function sug(){var L=[];ST.cfg.prods.forEach(function(p){var x=est(p,ST.S[p.id]);if(x=="r"||x=="a"){var q=Math.round((obj(p)-ST.S[p.id])*10)/10;if(q>0)L.push({i:p.id,q:q,x:x})}});L.sort(function(a,b){return(a.x=="r"?0:1)-(b.x=="r"?0:1)});return L}
function lista(q,cat,fil){var t=norm(q);return ST.cfg.prods.filter(function(p){if(cat&&p.cat!=cat)return false;if(t&&norm(p.n+" "+(p.cod||"")).indexOf(t)<0)return false;if(fil){var x=est(p,ST.S[p.id]);if(fil=="c"&&x!="r")return false;if(fil=="r"&&x!="a")return false}return true})}
/* ---------- búsqueda para agregar productos ---------- */
function busca(ctx,v){var h="",t=norm(v);if(t.length>=2){var L=lista(v,"","").slice(0,8);h=L.length?L.map(function(p){return'<div class="item"><span>'+esc(p.n)+'<br><small>'+esc(p.cod||"")+' · en stock: '+f(ST.S[p.id])+' '+esc(p.u)+'</small></span><button class="btn s" style="margin:0" onclick="addC(\''+ctx+'\',\''+p.id+'\')">Agregar</button></div>'}).join(""):'<div class="sm" style="margin-bottom:6px">No hay productos con ese nombre.</div>'}$("res").innerHTML=h}
function addC(ctx,id){var p=P(id);if(ctx=="s"){var e=ST.cart.filter(function(l){return l.i==id})[0];if(e)e.q+=1;else ST.cart.push({i:id,q:1,p:+p.pv||0})}else{var e2=ST.fd.it.filter(function(l){return l.i==id})[0];if(e2)e2.q+=1;else ST.fd.it.push({i:id,q:1,p:+p.pr||0})}render()}
/* ---------- Inicio ---------- */
function vVacio(){return'<div class="card"><h2>Empiece aquí</h2><div class="sm" style="margin-bottom:8px">Todavía no hay productos. Cargue su lista desde un archivo CSV (Excel: «Guardar como» → CSV) o agregue el primero.</div><button class="btn" onclick="ST.mas=\'imp\';go(\'mas\')">Importar productos (CSV)</button><button class="btn o" onclick="ST.add=true;go(\'stk\')">Agregar un producto</button><button class="btn o" onclick="loadEj()">Cargar productos de ejemplo</button></div>'}
function vIni(){var Pd=ST.cfg.prods;if(!Pd.length)return vVacio();var L=sug(),r=0,a=0,h="";
 Pd.forEach(function(p){var x=est(p,ST.S[p.id]);if(x=="r")r++;if(x=="a")a++});
 if(!ST.conteos.length)h+='<div class="msg m-a"><b>Antes de empezar:</b> haga el conteo físico en la pestaña Stock. Mientras no se haga, el sistema parte de cero.</div>';
 else if(r)h+='<div class="msg m-r"><b>Alerta:</b> '+r+' producto(s) bajo el mínimo.</div>';
 var td=iso(),n=0,tot=0,v30={},lim=Date.now()-30*864e5;
 ST.salidas.forEach(function(s){if(s.tipo=="Venta"){s.it.forEach(function(l){if(s.fecha==td){n+=l[1];tot+=l[1]*l[2]}if(s.ts>lim)v30[l[0]]=(v30[l[0]]||0)+l[1]})}});
 h+='<div class="kpis"><div class="kpi"><b>'+Pd.length+'</b><span>Productos</span></div><div class="kpi"><b class="c-r">'+r+'</b><span>Críticos</span></div><div class="kpi"><b class="c-a">'+a+'</b><span>Por revisar</span></div><div class="kpi"><b>'+L.length+'</b><span>Compras sugeridas</span></div></div>';
 h+='<div class="card"><h2>Compra sugerida</h2>'+(L.length?L.slice(0,8).map(function(x){var p=P(x.i);return'<div class="item"><span>'+esc(p.n)+'<br><small class="c-'+x.x+'">'+lab(x.x)+'</small></span><b>'+f(x.q)+' '+esc(p.u)+'</b></div>'}).join("")+(L.length>8?'<div class="sm">y '+(L.length-8)+' más…</div>':'')+'<button class="btn" onclick="irFac()">Registrar factura de esta compra</button>':'<div class="sm">No hay compras pendientes.</div>')+'</div>';
 h+='<div class="card"><h2>Ventas de hoy</h2><div class="item"><span>Unidades vendidas</span><b>'+f(n)+'</b></div><div class="item"><span>Total vendido</span><b>'+m(tot)+'</b></div></div>';
 var top=Object.keys(v30).sort(function(x,y){return v30[y]-v30[x]}).slice(0,5);
 if(top.length)h+='<div class="card"><h2>Más vendidos (30 días)</h2>'+top.map(function(id){var p=P(id);return'<div class="item"><span>'+esc(p.n)+'</span><b>'+f(v30[id])+' '+esc(p.u)+'</b></div>'}).join("")+'</div>';
 return h}
/* ---------- Salidas ---------- */
function vSal(){if(!ST.cfg.prods.length)return vVacio();var h='<div class="card"><h2>Registrar salida</h2><div class="g2"><div><label>Tipo</label><select onchange="ST.tipo=this.value;render()">'+opts(["Venta","Merma"],ST.tipo)+'</select></div><div><label>Fecha</label><input type="date" id="sf" value="'+iso()+'"></div></div><label>Buscar producto o código</label><input id="bq" placeholder="Escriba al menos 2 letras" oninput="busca(\'s\',this.value)"><div id="res"></div>';
 ST.cart.forEach(function(l,k){var p=P(l.i);h+='<div class="item" style="display:block"><div style="display:flex;justify-content:space-between"><b>'+esc(p.n)+'</b><button class="btn s d" style="margin:0;padding:3px 9px" onclick="ST.cart.splice('+k+',1);render()">×</button></div><div class="g2"><div><label>Cantidad ('+esc(p.u)+')</label><input type="number" step="any" inputmode="decimal" value="'+l.q+'" oninput="ST.cart['+k+'].q=parseFloat(this.value)||0;totS()"></div>'+(ST.tipo=="Venta"?'<div><label>Precio (S/)</label><input type="number" step="0.1" inputmode="decimal" value="'+l.p+'" oninput="ST.cart['+k+'].p=parseFloat(this.value)||0;totS()"></div>':'<div></div>')+'</div></div>'});
 h+=(ST.cart.length?'<div class="item"><span>Total</span><b id="tt"></b></div><button class="btn" onclick="saveSal()">Guardar '+(ST.tipo=="Venta"?"venta":"merma")+'</button>':'<div class="sm">Busque un producto para agregarlo.</div>')+'</div>';
 h+='<div class="card"><h2>Últimas salidas</h2>'+(ST.salidas.length?ST.salidas.slice(-8).reverse().map(function(s){var t=0,u=0;s.it.forEach(function(l){t+=l[1]*l[2];u+=l[1]});return'<div class="item"><span>'+fd(s.fecha)+' · '+s.tipo+'<br><small>'+s.it.length+' producto(s) · '+f(u)+' unidades'+(s.tipo=="Venta"?' · '+m(t):'')+'</small></span><button class="btn s d" style="margin:0" onclick="arm(\'salidas\',\''+s.id+'\')">'+(ST.conf=="salidas"+s.id?"Tocar de nuevo":"Anular")+'</button></div>'}).join(""):'<div class="sm">Aún no hay salidas.</div>')+'</div>';return h}
function totS(){var t=0;ST.cart.forEach(function(l){t+=l.q*(ST.tipo=="Venta"?l.p:0)});if($("tt"))$("tt").textContent=ST.tipo=="Venta"?m(t):"—"}
function saveSal(){if(!ST.cart.length||ST.cart.some(function(l){return!(l.q>0)})){toast("Revise las cantidades");return}
 var ts=Date.now();put("salidas",{id:"s"+ts,ts:ts,fecha:$("sf").value||iso(),tipo:ST.tipo,it:ST.cart.map(function(l){return[l.i,l.q,ST.tipo=="Venta"?l.p:0]})});ST.cart=[];render();toast("Salida guardada")}
/* ---------- Compras ---------- */
function irFac(){var L=sug();ST.fd={no:"",pv:"",npn:"",npr:"",fecha:iso(),cond:"Contado",forma:"Efectivo",obs:"",foto:"",it:L.slice(0,40).map(function(x){return{i:x.i,q:x.q,p:+P(x.i).pr||0}})};ST.tab="com";ST.sub="nue";render()}
function vCom(){if(!ST.cfg.prods.length)return vVacio();var h='<div class="seg">'+[["sug","Sugerida"],["nue","Nueva factura"],["lis","Facturas"]].map(function(s){return'<button class="'+(ST.sub==s[0]?"on":"")+'" onclick="ST.sub=\''+s[0]+'\';render()">'+s[1]+'</button>'}).join("")+'</div>';
 if(ST.sub=="sug"){var L=sug();h+='<div class="card"><h2>Compra sugerida</h2>'+(L.length?L.slice(0,40).map(function(x){var p=P(x.i);return'<div class="item"><span>'+esc(p.n)+'<br><small>en stock '+f(ST.S[x.i])+' · mínimo '+f(p.min)+' · <span class="c-'+x.x+'">'+lab(x.x)+'</span></small></span><b>'+f(x.q)+' '+esc(p.u)+'</b></div>'}).join("")+(L.length>40?'<div class="sm">Se muestran 40 de '+L.length+'.</div>':'')+'<div class="det"><b>¿Cómo se calcula?</b> Compra = stock máximo − stock actual. Si un producto no tiene máximo, se usa el doble del mínimo.</div><button class="btn" onclick="irFac()">Registrar factura de esta compra</button>':'<div class="sm">No hay compras pendientes.</div>')+'</div>'}
 else if(ST.sub=="nue")h+=vFac();else h+=vLis();return h}
function vFac(){if(!ST.fd)ST.fd={no:"",pv:"",npn:"",npr:"",fecha:iso(),cond:"Contado",forma:"Efectivo",obs:"",foto:"",it:[]};var d=ST.fd,h='<div class="card"><h2>Registrar factura de compra</h2><label>Proveedor</label><select onchange="sf(\'pv\',this.value);render()"><option value="">Elegir…</option>'+ST.cfg.pvs.map(function(p){return'<option value="'+esc(p.n)+'"'+(d.pv==p.n?" selected":"")+'>'+esc(p.n)+'</option>'}).join("")+'<option value="__n"'+(d.pv=="__n"?" selected":"")+'>+ Proveedor nuevo…</option></select>';
 if(d.pv=="__n")h+='<div class="g2"><div><label>Nombre</label><input value="'+esc(d.npn)+'" onchange="sf(\'npn\',this.value)"></div><div><label>RUC</label><input inputmode="numeric" maxlength="11" value="'+esc(d.npr)+'" onchange="sf(\'npr\',this.value)"></div></div>';
 else if(d.pv){var pv=ST.cfg.pvs.filter(function(p){return p.n==d.pv})[0];h+='<div class="sm" style="margin:-4px 0 8px">RUC: '+esc(pv?pv.ruc:"")+'</div>'}
 h+='<div class="g2"><div><label>N.º de factura</label><input placeholder="F001-00045" value="'+esc(d.no)+'" onchange="sf(\'no\',this.value)"></div><div><label>Fecha de emisión</label><input type="date" value="'+d.fecha+'" onchange="sf(\'fecha\',this.value)"></div><div><label>Condición de pago</label><select onchange="sf(\'cond\',this.value)">'+opts(["Contado","Crédito 15 días","Crédito 30 días"],d.cond)+'</select></div><div><label>Forma de pago</label><select onchange="sf(\'forma\',this.value)">'+opts(["Efectivo","Yape o Plin","Transferencia"],d.forma)+'</select></div></div><h3>Detalle de lo comprado</h3>';

function loadEj(){var now=Date.now(),q={},by={};ST.cfg.prods.forEach(function(p){if(p.cod)by[p.cod]=1});var n=0;
 EJ.forEach(function(e,k){if(by[e[0]])return;var id="p"+now+"_"+k;ST.cfg.prods.push({id:id,cod:e[0],n:e[1],u:e[2],cat:e[3],min:e[5],max:e[6],pr:e[7],pv:e[8],s0:0});q[id]=e[4];n++});
 saveCfg();if(n)put("conteos",{id:"c"+now,ts:now,fecha:iso(),q:q,ex:null});ST.tab="ini";render();toast(n?n+" productos de ejemplo cargados":"Los de ejemplo ya están cargados")}
function wipe(){if(ST.conf!="wipe"){ST.conf="wipe";render();toast("Toque de nuevo para borrar TODOS los datos");return}
 ST.conf=null;COLS.forEach(function(c){ST[c]=[];ls(c,[])});ST.cfg=cl(DEF);saveCfg();ST.cart=[];ST.fd=null;ST.cnt={};ST.cm=false;ST.add=false;ST.imp=null;ST.q="";ST.cat="";ST.fil="";ST.tab="ini";render();toast("Datos borrados")}
function dump(){return JSON.stringify({app:"smartstock-tienda",ver:VER,fecha:iso(),cfg:ST.cfg,salidas:ST.salidas,facturas:ST.facturas,conteos:ST.conteos})}
function expo(){bajar("smartstock-tienda-respaldo-"+iso()+".json",dump(),"application/json")||(function(){var t=$("imp");if(t){t.value=dump();t.select()}})()}
function impo(){try{var o=JSON.parse($("imp").value);if(o.app!="smartstock-tienda")throw 0;ST.cfg=o.cfg;saveCfg();COLS.forEach(function(c){ST[c]=o[c]||[];ls(c,ST[c])});render();toast("Respaldo restaurado")}catch(e){toast("El texto no es un respaldo válido de Tienda")}}

var TABS=[["ini","Inicio"],["sal","Salidas"],["com","Compras"],["stk","Stock"],["mas","Más"]];
function render(){ST.S=stockAll();var v={ini:vIni,sal:vSal,com:vCom,stk:vStk,mas:vMas}[ST.tab];$("app").innerHTML=v();
 $("tabs").innerHTML=TABS.map(function(t){return'<button class="'+(ST.tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 $("ver").textContent=VER;if(ST.tab=="com"&&ST.sub=="nue")tot();if(ST.tab=="sal")totS()}
function go(t){ST.tab=t;ST.op=null;ST.conf=null;render();window.scrollTo(0,0)}
loadLocal();render();

 navigator.serviceWorker.register("sw.js").then(function(r){swReg=r}).catch(function(){});
 navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadSW)$("upd").className="on"});
 document.addEventListener("visibilitychange",function(){if(!document.hidden&&swReg)swReg.update().catch(function(){})})}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
